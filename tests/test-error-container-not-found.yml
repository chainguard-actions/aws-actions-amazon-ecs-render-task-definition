name: Test error - container not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        continue-on-error: true
        with:
          task-definition: tests/fixtures/task-definition-basic.json
          container-name: nonexistent-container
          image: nginx:1.25.0

      - name: Assert action failed with container not found error
        env:
          OUTCOME: ${{ steps.render.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when container is not found, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when container was not found"
