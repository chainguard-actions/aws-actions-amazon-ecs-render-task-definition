name: Test basic image update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          task-definition: tests/fixtures/task-definition-basic.json
          container-name: web
          image: nginx:1.25.0

      - name: Assert output path is set
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "task-definition output: $TASK_DEF_PATH"
          if [ -z "$TASK_DEF_PATH" ]; then
            echo "FAIL: task-definition output is empty"
            exit 1
          fi
          echo "PASS: task-definition output is set"

      - name: Assert output file exists
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "Checking file: $TASK_DEF_PATH"
          if [ ! -f "$TASK_DEF_PATH" ]; then
            echo "FAIL: rendered task definition file does not exist at $TASK_DEF_PATH"
            exit 1
          fi
          echo "PASS: rendered task definition file exists"

      - name: Assert image was updated
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "Contents of rendered task definition:"
          cat "$TASK_DEF_PATH"
          IMAGE=$(jq -r '.containerDefinitions[] | select(.name=="web") | .image' "$TASK_DEF_PATH")
          echo "image: $IMAGE"
          if [ "$IMAGE" != "nginx:1.25.0" ]; then
            echo "FAIL: expected image 'nginx:1.25.0', got '$IMAGE'"
            exit 1
          fi
          echo "PASS: image was correctly updated"

      - name: Assert family is preserved
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          FAMILY=$(jq -r '.family' "$TASK_DEF_PATH")
          echo "family: $FAMILY"
          if [ "$FAMILY" != "test-task" ]; then
            echo "FAIL: expected family 'test-task', got '$FAMILY'"
            exit 1
          fi
          echo "PASS: family is preserved"

      - name: Assert ignored attributes are removed
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          # These attributes should be stripped from the output
          for attr in taskDefinitionArn revision status compatibilities requiresAttributes registeredAt deregisteredAt registeredBy; do
            VALUE=$(jq -r ".$attr // \"null\"" "$TASK_DEF_PATH")
            echo "$attr: $VALUE"
            if [ "$VALUE" != "null" ]; then
              echo "FAIL: attribute '$attr' should have been removed but got '$VALUE'"
              exit 1
            fi
          done
          echo "PASS: ignored attributes are removed"
