name: Test rendering with secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          task-definition: tests/fixtures/task-definition.json
          container-name: web
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:latest
          environment-variables: |
            APP_ENV=production
          secrets: |
            DB_PASSWORD=arn:aws:secretsmanager:us-east-1:123456789012:secret:my-db-password-AbCdEf
            API_KEY=arn:aws:ssm:us-east-1:123456789012:parameter/my-api-key

      - name: Assert task-definition output is set
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "output path: $OUTPUT_PATH"
          if [ -z "$OUTPUT_PATH" ]; then
            echo "FAIL: task-definition output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert DB_PASSWORD secret was added
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          SECRET_VAL=$(jq -r '.containerDefinitions[] | select(.name=="web") | .secrets[] | select(.name=="DB_PASSWORD") | .valueFrom' "$OUTPUT_PATH")
          echo "DB_PASSWORD valueFrom: $SECRET_VAL"
          EXPECTED="arn:aws:secretsmanager:us-east-1:123456789012:secret:my-db-password-AbCdEf"
          if [ "$SECRET_VAL" != "$EXPECTED" ]; then
            echo "FAIL: expected DB_PASSWORD valueFrom '$EXPECTED' but got '$SECRET_VAL'"
            exit 1
          fi
          echo "PASS: DB_PASSWORD secret correctly added"

      - name: Assert API_KEY secret was added
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          SECRET_VAL=$(jq -r '.containerDefinitions[] | select(.name=="web") | .secrets[] | select(.name=="API_KEY") | .valueFrom' "$OUTPUT_PATH")
          echo "API_KEY valueFrom: $SECRET_VAL"
          EXPECTED="arn:aws:ssm:us-east-1:123456789012:parameter/my-api-key"
          if [ "$SECRET_VAL" != "$EXPECTED" ]; then
            echo "FAIL: expected API_KEY valueFrom '$EXPECTED' but got '$SECRET_VAL'"
            exit 1
          fi
          echo "PASS: API_KEY secret correctly added"

      - name: Assert secrets array has correct count
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          COUNT=$(jq '.containerDefinitions[] | select(.name=="web") | .secrets | length' "$OUTPUT_PATH")
          echo "secrets count: $COUNT"
          if [ "$COUNT" != "2" ]; then
            echo "FAIL: expected 2 secrets but got $COUNT"
            exit 1
          fi
          echo "PASS: correct number of secrets"
