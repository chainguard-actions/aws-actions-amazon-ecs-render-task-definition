name: Test docker labels and command injection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/ecs-test

      - name: Create task definition file
        run: |
          cat > /tmp/ecs-test/task-def-labels.json << 'EOF'
          {
            "family": "my-task",
            "containerDefinitions": [
              {
                "name": "app-container",
                "image": "old-image:latest",
                "cpu": 256,
                "memory": 512,
                "essential": true
              }
            ]
          }
          EOF

      - id: render
        uses: .
        with:
          task-definition: /tmp/ecs-test/task-def-labels.json
          container-name: app-container
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v1.0.0
          docker-labels: |
            version=1.0.0
            environment=production
          command: node server.js --port 8080

      - name: Assert output file exists
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "checking file: $OUTPUT_PATH"
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "FAIL: output file does not exist at $OUTPUT_PATH"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert docker labels are set
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          LABELS_JSON=$(cat "$OUTPUT_PATH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d['containerDefinitions'][0]['dockerLabels']))")
          echo "dockerLabels: $LABELS_JSON"

          VERSION=$(echo "$LABELS_JSON" | python3 -c "import sys,json; labels=json.load(sys.stdin); print(labels.get('version', 'NOT_FOUND'))")
          echo "version label: $VERSION"
          if [ "$VERSION" != "1.0.0" ]; then
            echo "FAIL: expected version label '1.0.0', got '$VERSION'"
            exit 1
          fi

          ENV_LABEL=$(echo "$LABELS_JSON" | python3 -c "import sys,json; labels=json.load(sys.stdin); print(labels.get('environment', 'NOT_FOUND'))")
          echo "environment label: $ENV_LABEL"
          if [ "$ENV_LABEL" != "production" ]; then
            echo "FAIL: expected environment label 'production', got '$ENV_LABEL'"
            exit 1
          fi

          echo "PASS: docker labels correctly set"

      - name: Assert command is set
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          COMMAND_JSON=$(cat "$OUTPUT_PATH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d['containerDefinitions'][0]['command']))")
          echo "command: $COMMAND_JSON"

          CMD_LEN=$(echo "$COMMAND_JSON" | python3 -c "import sys,json; cmd=json.load(sys.stdin); print(len(cmd))")
          echo "command length: $CMD_LEN"
          if [ "$CMD_LEN" != "4" ]; then
            echo "FAIL: expected command length 4, got '$CMD_LEN'"
            exit 1
          fi

          FIRST_CMD=$(echo "$COMMAND_JSON" | python3 -c "import sys,json; cmd=json.load(sys.stdin); print(cmd[0])")
          echo "first command element: $FIRST_CMD"
          if [ "$FIRST_CMD" != "node" ]; then
            echo "FAIL: expected first command element 'node', got '$FIRST_CMD'"
            exit 1
          fi

          echo "PASS: command correctly set"
