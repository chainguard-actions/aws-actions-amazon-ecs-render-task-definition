name: Test error when container name not found in task definition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        continue-on-error: true
        with:
          task-definition: tests/fixtures/task-definition.json
          container-name: nonexistent-container
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:latest

      - name: Assert action failed with container not found error
        env:
          OUTCOME: ${{ steps.render.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when container name is not found, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when container name not found"
