name: Test basic task definition rendering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          task-definition: tests/fixtures/task-definition.json
          container-name: web
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v1.2.3

      - name: Assert task-definition output is set
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "output path: $OUTPUT_PATH"
          if [ -z "$OUTPUT_PATH" ]; then
            echo "FAIL: task-definition output is empty"
            exit 1
          fi
          echo "PASS: task-definition output is set to $OUTPUT_PATH"

      - name: Assert rendered file exists
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "checking file: $OUTPUT_PATH"
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "FAIL: rendered task definition file does not exist at $OUTPUT_PATH"
            exit 1
          fi
          echo "PASS: file exists"

      - name: Assert image was updated in rendered file
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "reading rendered file: $OUTPUT_PATH"
          ACTUAL=$(jq -r '.containerDefinitions[] | select(.name=="web") | .image' "$OUTPUT_PATH")
          EXPECTED="123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v1.2.3"
          echo "image: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected image '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: image correctly updated"

      - name: Assert family is preserved
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          FAMILY=$(jq -r '.family' "$OUTPUT_PATH")
          echo "family: $FAMILY"
          if [ "$FAMILY" != "test-task" ]; then
            echo "FAIL: expected family 'test-task' but got '$FAMILY'"
            exit 1
          fi
          echo "PASS: family preserved"
