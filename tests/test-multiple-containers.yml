name: Test rendering with multiple containers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          task-definition: tests/fixtures/task-definition.json
          container-name: web,sidecar
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v2.0.0

      - name: Assert task-definition output is set
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "output path: $OUTPUT_PATH"
          if [ -z "$OUTPUT_PATH" ]; then
            echo "FAIL: task-definition output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert web container image was updated
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          WEB_IMAGE=$(jq -r '.containerDefinitions[] | select(.name=="web") | .image' "$OUTPUT_PATH")
          EXPECTED="123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v2.0.0"
          echo "web image: $WEB_IMAGE"
          if [ "$WEB_IMAGE" != "$EXPECTED" ]; then
            echo "FAIL: expected web image '$EXPECTED' but got '$WEB_IMAGE'"
            exit 1
          fi
          echo "PASS: web container image correctly updated"

      - name: Assert sidecar container image was updated
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          SIDECAR_IMAGE=$(jq -r '.containerDefinitions[] | select(.name=="sidecar") | .image' "$OUTPUT_PATH")
          EXPECTED="123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v2.0.0"
          echo "sidecar image: $SIDECAR_IMAGE"
          if [ "$SIDECAR_IMAGE" != "$EXPECTED" ]; then
            echo "FAIL: expected sidecar image '$EXPECTED' but got '$SIDECAR_IMAGE'"
            exit 1
          fi
          echo "PASS: sidecar container image correctly updated"

      - name: Assert both containers are present in rendered file
        env:
          OUTPUT_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          COUNT=$(jq '.containerDefinitions | length' "$OUTPUT_PATH")
          echo "container count: $COUNT"
          if [ "$COUNT" != "2" ]; then
            echo "FAIL: expected 2 containers but got '$COUNT'"
            exit 1
          fi
          echo "PASS: both containers present"
