name: Test command override and secrets injection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          task-definition: tests/fixtures/task-definition.json
          container-name: web
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v5.0.0
          command: /bin/sh -c echo
          secrets: |
            DB_PASSWORD=arn:aws:secretsmanager:us-east-1:123456789012:secret:my-db-password-AbCdEf
            API_KEY=arn:aws:secretsmanager:us-east-1:123456789012:secret:my-api-key-XyZaBc

      - name: Assert output path is set
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "task-definition output: $TASK_DEF_PATH"
          if [ -z "$TASK_DEF_PATH" ]; then
            echo "FAIL: task-definition output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert command is set in rendered file
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "Contents of rendered task definition:"
          cat "$TASK_DEF_PATH"

          # The action splits command by spaces: "/bin/sh -c echo" -> ["/bin/sh", "-c", "echo"]
          COMMAND_LEN=$(python3 -c "
          import json
          data = json.load(open('$TASK_DEF_PATH'))
          container = [c for c in data['containerDefinitions'] if c['name'] == 'web'][0]
          cmd = container.get('command', [])
          print(len(cmd))
          ")
          echo "command array length: $COMMAND_LEN"
          if [ "$COMMAND_LEN" != "3" ]; then
            echo "FAIL: expected command array length 3 but got '$COMMAND_LEN'"
            exit 1
          fi

          COMMAND_0=$(python3 -c "
          import json
          data = json.load(open('$TASK_DEF_PATH'))
          container = [c for c in data['containerDefinitions'] if c['name'] == 'web'][0]
          print(container.get('command', [])[0])
          ")
          echo "command[0]: $COMMAND_0"
          if [ "$COMMAND_0" != "/bin/sh" ]; then
            echo "FAIL: expected command[0] '/bin/sh' but got '$COMMAND_0'"
            exit 1
          fi
          echo "PASS: command correctly set"

      - name: Assert secrets are injected
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          DB_SECRET=$(python3 -c "
          import json
          data = json.load(open('$TASK_DEF_PATH'))
          container = [c for c in data['containerDefinitions'] if c['name'] == 'web'][0]
          secrets = {s['name']: s['valueFrom'] for s in container.get('secrets', [])}
          print(secrets.get('DB_PASSWORD', ''))
          ")
          echo "DB_PASSWORD valueFrom: $DB_SECRET"
          EXPECTED_DB="arn:aws:secretsmanager:us-east-1:123456789012:secret:my-db-password-AbCdEf"
          if [ "$DB_SECRET" != "$EXPECTED_DB" ]; then
            echo "FAIL: expected DB_PASSWORD valueFrom '$EXPECTED_DB' but got '$DB_SECRET'"
            exit 1
          fi

          API_SECRET=$(python3 -c "
          import json
          data = json.load(open('$TASK_DEF_PATH'))
          container = [c for c in data['containerDefinitions'] if c['name'] == 'web'][0]
          secrets = {s['name']: s['valueFrom'] for s in container.get('secrets', [])}
          print(secrets.get('API_KEY', ''))
          ")
          echo "API_KEY valueFrom: $API_SECRET"
          EXPECTED_API="arn:aws:secretsmanager:us-east-1:123456789012:secret:my-api-key-XyZaBc"
          if [ "$API_SECRET" != "$EXPECTED_API" ]; then
            echo "FAIL: expected API_KEY valueFrom '$EXPECTED_API' but got '$API_SECRET'"
            exit 1
          fi

          echo "PASS: secrets correctly injected"
