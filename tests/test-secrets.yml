name: Test secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          task-definition: tests/fixtures/task-definition-basic.json
          container-name: web
          image: nginx:1.25.0
          environment-variables: |
            APP_ENV=production
          secrets: |
            DB_PASSWORD=arn:aws:secretsmanager:us-east-1:123456789012:secret:db-password-abc123
            API_KEY=arn:aws:ssm:us-east-1:123456789012:parameter/api-key

      - name: Assert output file exists
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          if [ ! -f "$TASK_DEF_PATH" ]; then
            echo "FAIL: rendered task definition file does not exist"
            exit 1
          fi
          echo "PASS: rendered task definition file exists"

      - name: Assert secrets were added
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "Contents of rendered task definition:"
          cat "$TASK_DEF_PATH"
          DB_PASSWORD_ARN=$(jq -r '.containerDefinitions[] | select(.name=="web") | .secrets[] | select(.name=="DB_PASSWORD") | .valueFrom' "$TASK_DEF_PATH")
          echo "DB_PASSWORD valueFrom: $DB_PASSWORD_ARN"
          if [ "$DB_PASSWORD_ARN" != "arn:aws:secretsmanager:us-east-1:123456789012:secret:db-password-abc123" ]; then
            echo "FAIL: expected DB_PASSWORD valueFrom 'arn:aws:secretsmanager:us-east-1:123456789012:secret:db-password-abc123', got '$DB_PASSWORD_ARN'"
            exit 1
          fi
          echo "PASS: DB_PASSWORD secret was added correctly"

      - name: Assert second secret was added
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          API_KEY_ARN=$(jq -r '.containerDefinitions[] | select(.name=="web") | .secrets[] | select(.name=="API_KEY") | .valueFrom' "$TASK_DEF_PATH")
          echo "API_KEY valueFrom: $API_KEY_ARN"
          if [ "$API_KEY_ARN" != "arn:aws:ssm:us-east-1:123456789012:parameter/api-key" ]; then
            echo "FAIL: expected API_KEY valueFrom 'arn:aws:ssm:us-east-1:123456789012:parameter/api-key', got '$API_KEY_ARN'"
            exit 1
          fi
          echo "PASS: API_KEY secret was added correctly"

      - name: Assert environment variable was also set
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          APP_ENV=$(jq -r '.containerDefinitions[] | select(.name=="web") | .environment[] | select(.name=="APP_ENV") | .value' "$TASK_DEF_PATH")
          echo "APP_ENV: $APP_ENV"
          if [ "$APP_ENV" != "production" ]; then
            echo "FAIL: expected APP_ENV='production', got '$APP_ENV'"
            exit 1
          fi
          echo "PASS: environment variable was set correctly alongside secrets"
