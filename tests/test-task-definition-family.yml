name: Test task-definition-family input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The task-definition-family input causes the action to call ECS DescribeTaskDefinition
      # to fetch the latest revision of the named family. Without real AWS credentials
      # this call will fail. We allow failure and assert the action either succeeded
      # (if credentials are available) or failed gracefully with an ECS error (not a code bug).
      - id: render
        uses: .
        continue-on-error: true
        with:
          task-definition-family: test-task-family
          container-name: web
          image: nginx:1.25.0

      - name: Assert action ran with task-definition-family input
        env:
          OUTCOME: ${{ steps.render.outcome }}
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition output: $TASK_DEF_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_PATH" ]; then
              echo "FAIL: action succeeded but task-definition output is empty"
              exit 1
            fi
            if [ ! -f "$TASK_DEF_PATH" ]; then
              echo "FAIL: action succeeded but rendered file does not exist at $TASK_DEF_PATH"
              exit 1
            fi
            echo "PASS: action succeeded and rendered task definition file exists"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ECS API not reachable without credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
