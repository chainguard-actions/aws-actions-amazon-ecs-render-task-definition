name: Test secrets injection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          task-definition: tests/fixtures/task-definition-basic.json
          container-name: web
          image: myapp:latest
          secrets: |
            DB_PASSWORD=arn:aws:secretsmanager:us-east-1:123456789012:secret:myapp/db-password-AbCdEf
            API_KEY=arn:aws:ssm:us-east-1:123456789012:parameter/myapp/api-key

      - name: Assert output file exists
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          if [ ! -f "$TASK_DEF_PATH" ]; then
            echo "FAIL: rendered task definition file does not exist"
            exit 1
          fi
          echo "PASS: rendered task definition file exists"

      - name: Assert DB_PASSWORD secret was added
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          VALUE_FROM=$(jq -r '.containerDefinitions[] | select(.name=="web") | .secrets[] | select(.name=="DB_PASSWORD") | .valueFrom' "$TASK_DEF_PATH")
          echo "actual DB_PASSWORD valueFrom: $VALUE_FROM"
          EXPECTED="arn:aws:secretsmanager:us-east-1:123456789012:secret:myapp/db-password-AbCdEf"
          if [ "$VALUE_FROM" != "$EXPECTED" ]; then
            echo "FAIL: expected DB_PASSWORD valueFrom '$EXPECTED' but got '$VALUE_FROM'"
            exit 1
          fi
          echo "PASS: DB_PASSWORD secret correctly added"

      - name: Assert API_KEY secret was added
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          VALUE_FROM=$(jq -r '.containerDefinitions[] | select(.name=="web") | .secrets[] | select(.name=="API_KEY") | .valueFrom' "$TASK_DEF_PATH")
          echo "actual API_KEY valueFrom: $VALUE_FROM"
          EXPECTED="arn:aws:ssm:us-east-1:123456789012:parameter/myapp/api-key"
          if [ "$VALUE_FROM" != "$EXPECTED" ]; then
            echo "FAIL: expected API_KEY valueFrom '$EXPECTED' but got '$VALUE_FROM'"
            exit 1
          fi
          echo "PASS: API_KEY secret correctly added"

      - name: Assert secrets count is correct
        env:
          TASK_DEF_PATH: ${{ steps.render.outputs.task-definition }}
        run: |
          COUNT=$(jq '.containerDefinitions[] | select(.name=="web") | .secrets | length' "$TASK_DEF_PATH")
          echo "actual secrets count: $COUNT"
          if [ "$COUNT" != "2" ]; then
            echo "FAIL: expected 2 secrets but got $COUNT"
            exit 1
          fi
          echo "PASS: secrets count is correct"
